name: Security Remediation Scan

on:
  # Run every Sunday at 8:00 AM UTC
  schedule:
    - cron: '0 8 * * 0'

  # Manual trigger
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — print findings without creating PRs'
        type: boolean
        default: false
      risk_filter:
        description: 'Only process findings at this risk level and above'
        type: choice
        options: [ALL, HIGH, MEDIUM]
        default: ALL

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:

  remediation-scan:
    name: Security Remediation Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id:       ${{ secrets.ARM_CLIENT_ID }}
          tenant-id:       ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run security scan
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
          AZURE_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
          AZURE_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
          GROQ_API_KEY:          ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN:          ${{ secrets.SECURITY_GITHUB_TOKEN }}
          GITHUB_REPO:           ${{ github.repository }}
          USE_MOCK_DATA:         "false"
          DEPENDENCY_LOOKBACK_DAYS: "30"
          DRY_RUN:               ${{ inputs.dry_run || 'false' }}
          RISK_FILTER:           ${{ inputs.risk_filter || 'ALL' }}
        run: |
          PYTHONPATH=. python remediation/main.py

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ github.run_number }}
          path: scan_report.json
          retention-days: 90