name: Shift Left Security Scan

# Reusable workflow — called from devops-platform-foundation
# and any other Terraform repo
on:
  workflow_call:
    inputs:
      terraform_dir:
        description: 'Directory containing Terraform files to scan'
        type: string
        default: '.'
      block_on_high:
        description: 'Block PR if HIGH severity findings found'
        type: boolean
        default: true
    secrets:
      GROQ_API_KEY:
        required: false   # AI explanation optional

  # Also callable standalone for testing
  workflow_dispatch:
    inputs:
      terraform_dir:
        description: 'Terraform directory to scan'
        default: '.'

jobs:

  scan:
    name: Checkov + tfsec + AI Explanation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout calling repo
        uses: actions/checkout@v4

      - name: Checkout security-auditor (for scan scripts)
        uses: actions/checkout@v4
        with:
          repository: vmprachi7/security-auditor
          path: .security-auditor

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install checkov openai httpx python-dotenv

      - name: Run Checkov + tfsec
        run: |
          bash .security-auditor/shift-left/scan.sh \
            "${{ inputs.terraform_dir || '.' }}" \
            "/tmp/scan-results"

      - name: Generate AI-explained PR comment
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          PYTHONPATH=.security-auditor python \
            .security-auditor/shift-left/ai_explainer.py \
            --checkov /tmp/scan-results/checkov.json \
            --tfsec   /tmp/scan-results/tfsec.json \
            --tf-dir  "${{ inputs.terraform_dir || '.' }}" \
            --output  /tmp/scan-results/pr-comment.md
        # Exit code 1 if HIGH findings — handled below

      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs      = require('fs');
            const comment = fs.readFileSync('/tmp/scan-results/pr-comment.md', 'utf8');

            // Delete previous scan comments
            const comments = await github.rest.issues.listComments({
              owner:      context.repo.owner,
              repo:       context.repo.repo,
              issue_number: context.issue.number,
            });

            for (const c of comments.data) {
              if (c.body.includes('Security Scan') && c.user.login === 'github-actions[bot]') {
                await github.rest.issues.deleteComment({
                  owner:      context.repo.owner,
                  repo:       context.repo.repo,
                  comment_id: c.id,
                });
              }
            }

            // Post new comment
            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
              body:         comment,
            });

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-${{ github.run_number }}
          path: /tmp/scan-results/
          retention-days: 30

      - name: Block PR on HIGH findings
        if: inputs.block_on_high != false
        run: |
          # Re-run explainer just to get exit code
          PYTHONPATH=.security-auditor python \
            .security-auditor/shift-left/ai_explainer.py \
            --checkov /tmp/scan-results/checkov.json \
            --tfsec   /tmp/scan-results/tfsec.json \
            --output  /tmp/pr-comment-check.md